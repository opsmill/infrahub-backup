# Minimal Infrahub Helm values for e2e testing in vcluster
global:
  imagePullPolicy: IfNotPresent

infrahub-backup:
  enabled: false

infrahubServer:
  replicas: 1
  infrahubServer:
    env:
      # The reset_database_pod fixture replaces the Neo4j pod while Infrahub
      # keeps running. Test every pooled connection before reuse, so a request
      # does not fail with 503 on a connection to the old pod.
      INFRAHUB_DB_LIVENESS_CHECK_TIMEOUT: "0"
    livenessProbe:
      failureThreshold: 120
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
    readinessProbe:
      httpGet:
        path: /api/config
        port: 8000
      failureThreshold: 120
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1

infrahubTaskWorker:
  replicas: 1
  infrahubTaskWorker:
    env:
      INFRAHUB_DB_LIVENESS_CHECK_TIMEOUT: "0"

upgrade:
  enabled: false

infrahubDemoData:
  enabled: false

prefect-server:
  postgresql:
    primary:
      startupProbe:
        enabled: true
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      resourcesPreset: none

rabbitmq:
  startupProbe:
    enabled: true
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 120
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 120
  resourcesPreset: none

neo4j:
  volumes:
    data:
      mode: dynamic
      dynamic:
        storageClassName: "local-path"

redis:
  master:
    startupProbe:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    resourcesPreset: none
