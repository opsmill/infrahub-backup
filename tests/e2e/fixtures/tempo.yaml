# Tempo configuration for the traces end-to-end tests (INFP-744).
# Based on development/tempo/config.yml of opsmill/infrahub, with the OTLP HTTP
# receiver open so the tests can post traces, and a short idle period so a
# trace is searchable a few seconds after its last span.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 2s
  max_block_duration: 5m

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
