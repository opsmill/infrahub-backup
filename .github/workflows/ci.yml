---
name: CI
# yamllint disable rule:truthy rule:line-length
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  files-changed:
    name: Detect which files have changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      go: ${{ steps.changes.outputs.go_all }}
      nix: ${{ steps.changes.outputs.nix_all }}
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  go-lint:
    if: needs.files-changed.outputs.go == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build watchdog
        run: make build-watchdog

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    if: needs.files-changed.outputs.go == 'true'
    needs: ["files-changed", "go-lint"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build watchdog
        run: make build-watchdog

      - name: Run tests
        run: make test

  e2e-tests-docker:
    if: needs.files-changed.outputs.go == 'true'
    needs: ["files-changed", "test"]
    runs-on:
      group: huge-runners
    # ~44s per create/restore cycle, which the database recovery inside the binary
    # dominates, across four class-scoped Infrahub stacks in the community leg and
    # five in the enterprise one — where the retention cases also run. Sharding this
    # job by test area is the durable fix; until then the cap has to clear the real
    # runtime rather than truncate it mid-suite.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [community, enterprise]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7

      - name: Install tini
        run: apt-get update && apt-get install -y tini

      - name: Build binaries (infrahub-backup, infrahub-taskmanager, infrahub-collect)
        run: make build

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: "Set environment variables"
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "PYTEST_DEBUG_TEMPROOT=/var/lib/github/${RUNNER_NAME}/_temp" >> $GITHUB_ENV

      # Cases marked `enterprise` run in the enterprise leg only: they do not depend on the
      # Neo4j edition, and on Community every backup they take stops and restarts the whole
      # deployment, which is most of what they cost. Enterprise backs up online.
      - name: Run e2e tests (Docker Compose)
        env:
          INFRAHUB_TESTING_ENTERPRISE: ${{ matrix.edition == 'enterprise' && 'true' || '' }}
          PYTEST_MARKERS: ${{ matrix.edition == 'enterprise' && 'docker' || 'docker and not enterprise' }}
        run: exec tini -s -g -- uv run pytest -v -m "$PYTEST_MARKERS" tests/e2e

  e2e-tests-k8s:
    if: needs.files-changed.outputs.go == 'true'
    needs: ["files-changed", "test"]
    runs-on:
      group: huge-runners
    # The enterprise leg also runs the two external-database sessions, each with its own
    # vcluster and Infrahub deployment.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [community, enterprise]
    env:
      INFRAHUB_HELM_CHART: ${{ matrix.edition == 'enterprise' && 'oci://registry.opsmill.io/opsmill/chart/infrahub-enterprise' || 'oci://registry.opsmill.io/opsmill/chart/infrahub' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up vCluster
        uses: loft-sh/setup-vcluster@68e17a8c3618e3c47d635842b803d4f560f694e8

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7

      - name: Install tini
        run: apt-get update && apt-get install -y tini

      - name: Build binaries (infrahub-backup, infrahub-taskmanager, infrahub-collect)
        run: make build

      # The external-database cases run the database tools from this image (ADR 0017) and
      # pass it with --external-db-image, because a development build has no published image
      # to default to. The vcluster is created by pytest, so the `external_db_image` fixture
      # loads the image into the cluster's nodes; it is tagged with the commit rather than
      # `latest` so that the workload takes it from the node instead of pulling it.
      - name: Build the infrahub-backup image under test
        run: |
          docker build -t "infrahub-backup:e2e-${GITHUB_SHA}" .
          echo "INFRAHUB_TESTING_EXTERNAL_DB_IMAGE=infrahub-backup:e2e-${GITHUB_SHA}" >> "$GITHUB_ENV"

      # The image's Java runtime and Neo4j jars are trimmed to what the tools load. This runner is
      # amd64, so this is where the trimmed image is checked on that architecture.
      - name: Check the image carries working database tools
        run: SKIP_BUILD=1 ./scripts/check-image-tools.sh "infrahub-backup:e2e-${GITHUB_SHA}"

      # The external-database suites (tasks.md T072) need Neo4j Enterprise, PostgreSQL and an
      # object store outside the cluster under test. They run as containers on one Docker
      # network, so Neo4j can fetch a restore's seed from MinIO by name. Pods in the vcluster
      # and the tool on the runner both reach them through the Docker host's bridge address,
      # where the ports are published. Only the enterprise leg declares the topology, so the
      # suites run once.
      - name: Start the external databases
        if: matrix.edition == 'enterprise'
        run: |
          docker rm -f ext-minio ext-neo4j ext-postgres 2>/dev/null || true
          docker network rm ext-db 2>/dev/null || true
          docker network create ext-db
          # The tool verifies certificates by default (FR-029) and always encrypts PostgreSQL,
          # so both servers present one self-signed certificate and the suites opt out of
          # verifying it. Neo4j keeps plain Bolt available for Infrahub's own connections.
          certs="${RUNNER_TEMP}/ext-db-certs"
          rm -rf "${certs}" && mkdir -p "${certs}/bolt/trusted" "${certs}/bolt/revoked"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=ext-db" \
            -keyout "${certs}/bolt/private.key" -out "${certs}/bolt/public.crt"
          cp "${certs}/bolt/public.crt" "${certs}/bolt/trusted/"
          chmod -R a+rX "${certs}"
          docker run -d --name ext-minio --network ext-db -p 19000:9000 \
            -e MINIO_ROOT_USER=extaccess -e MINIO_ROOT_PASSWORD=extsecretkey \
            --entrypoint sh pgsty/minio:RELEASE.2026-08-04T00-00-00Z \
            -c 'mkdir -p /data/infrahub-seed && minio server /data'
          docker run -d --name ext-neo4j --network ext-db -p 17687:7687 -p 6362:6362 \
            -v "${certs}:/ssl:ro" \
            -e NEO4J_dbms_ssl_policy_bolt_enabled=true \
            -e NEO4J_dbms_ssl_policy_bolt_base__directory=/ssl/bolt \
            -e NEO4J_dbms_ssl_policy_bolt_client__auth=NONE \
            -e NEO4J_server_bolt_tls__level=OPTIONAL \
            -e NEO4J_ACCEPT_LICENSE_AGREEMENT=yes -e NEO4J_AUTH=neo4j/admin12345 \
            -e NEO4J_server_backup_enabled=true \
            -e NEO4J_server_backup_listen__address=0.0.0.0:6362 \
            -e AWS_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=extaccess -e AWS_SECRET_ACCESS_KEY=extsecretkey \
            -e AWS_ENDPOINT_URL_S3=http://ext-minio:9000 \
            neo4j:2025.10.1-enterprise
          docker run -d --name ext-postgres --network ext-db -p 15432:5432 \
            -v "${certs}:/certs:ro" \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=prefect -e POSTGRES_DB=prefect \
            --entrypoint sh postgres:18-alpine -c '
              mkdir -p /etc/pgssl && cp /certs/bolt/public.crt /certs/bolt/private.key /etc/pgssl/ &&
              chown -R postgres /etc/pgssl && chmod 600 /etc/pgssl/private.key &&
              exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/etc/pgssl/public.crt -c ssl_key_file=/etc/pgssl/private.key'
          for i in $(seq 1 90); do
            docker exec ext-neo4j cypher-shell -u neo4j -p admin12345 'RETURN 1' && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec ext-postgres pg_isready -U postgres && break
            sleep 1
          done
          host=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          {
            echo "INFRAHUB_TESTING_EXTERNAL_NEO4J_ADDRESS=${host}:17687"
            echo "INFRAHUB_TESTING_EXTERNAL_NEO4J_USERNAME=neo4j"
            echo "INFRAHUB_TESTING_EXTERNAL_NEO4J_PASSWORD=admin12345"
            echo "INFRAHUB_TESTING_EXTERNAL_NEO4J_EDITION=enterprise"
            echo "INFRAHUB_TESTING_EXTERNAL_POSTGRES_ADDRESS=${host}:15432"
            echo "INFRAHUB_TESTING_EXTERNAL_POSTGRES_USERNAME=postgres"
            echo "INFRAHUB_TESTING_EXTERNAL_POSTGRES_PASSWORD=prefect"
            echo "INFRAHUB_TESTING_EXTERNAL_SEED_BUCKET=infrahub-seed"
            echo "INFRAHUB_TESTING_EXTERNAL_SEED_ENDPOINT=http://${host}:19000"
            echo "INFRAHUB_TESTING_EXTERNAL_SEED_ACCESS_KEY=extaccess"
            echo "INFRAHUB_TESTING_EXTERNAL_SEED_SECRET_KEY=extsecretkey"
            echo "INFRAHUB_TESTING_EXTERNAL_INSECURE_TLS=true"
            # Neo4j 2025.x reports no store size, so a capture needs one (tasks.md T158).
            echo "INFRAHUB_TESTING_EXTERNAL_SCRATCH_SIZE=2Gi"
          } >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: "Set environment variables"
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "VCLUSTER_DIR=/var/lib/github/${RUNNER_NAME}/_temp/.vcluster/config.json" >> $GITHUB_ENV

      - name: Run e2e tests (Kubernetes)
        run: exec tini -s -g -- uv run pytest -v -m k8s tests/e2e

      # Each external topology is its own pytest session, because the deployment under test
      # is created once per session from INFRAHUB_TESTING_EXTERNAL_DB.
      - name: Run e2e tests (Kubernetes, external Neo4j)
        if: matrix.edition == 'enterprise'
        env:
          INFRAHUB_TESTING_EXTERNAL_DB: database
        run: exec tini -s -g -- uv run pytest -v -m k8s tests/e2e/test_k8s_external_neo4j.py tests/e2e/test_k8s_external_in_namespace.py

      - name: Run e2e tests (Kubernetes, external Neo4j and PostgreSQL)
        if: matrix.edition == 'enterprise'
        env:
          INFRAHUB_TESTING_EXTERNAL_DB: database,task-manager-db
        run: exec tini -s -g -- uv run pytest -v -m k8s tests/e2e/test_k8s_external_both.py

      - name: Remove the external databases
        if: always() && matrix.edition == 'enterprise'
        run: |
          docker rm -f ext-minio ext-neo4j ext-postgres 2>/dev/null || true
          docker network rm ext-db 2>/dev/null || true

  nix-build:
    if: needs.files-changed.outputs.nix == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Verify if nix build succeeds
        run: nix build --no-link

  python-lint:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --only-group dev
      - name: Check code formatting
        run: |
          uv run --no-sync ruff format --check --diff
          uv run --no-sync ruff check --select I .
      - name: Run linters
        run: uv run --no-sync ruff check
      - name: Run type checks
        run: uv run --no-sync mypy .

  yaml-lint:
    if: needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --only-group dev
      - name: Run yamllint
        run: uv run --no-sync yamllint -s .

  markdown-lint:
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: uv sync --only-group dev
      - name: Run rumdl
        run: uv run --no-sync rumdl check .

  validate-documentation-style:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "yaml-lint", "markdown-lint"]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      VALE_VERSION: "3.13.0"
    steps:
      - uses: actions/checkout@v6
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
      - name: Validate documentation style
        run: ./vale $(find ./docs/docs -type f \( -name "*.mdx" -o -name "*.md" \))

  documentation:
    defaults:
      run:
        working-directory: ./docs
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "yaml-lint", "markdown-lint"]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs website
        run: pnpm run build
